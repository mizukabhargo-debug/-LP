<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご注文ありがとうございます | 陶雅</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="js/analytics.js"></script>
</head>
<body>
<div class="simple-page">
  <h1>ご注文ありがとうございます</h1>
  <p>長方形サイズ(縦180mm×横140mm / 税込¥143,000)のご決済が完了しました。</p>

  <div class="notice-box">
    最後にもう1ステップです。下記フォームより、大切な子のお写真とご要望をお送りください。<br>
    フォームのご提出をもってご注文確定となり、制作を開始いたします(納期の目安:約3週間〜1ヶ月)。
  </div>

  <p style="text-align:center; margin:32px 0;">
    <a class="btn btn-primary" id="order-form-link" href="#" target="_blank" rel="noopener">お写真・ご要望を提出する</a>
  </p>

  <p>ご不明点がございましたら <a href="mailto:info@bhargo.co.jp">info@bhargo.co.jp</a> までお気軽にご連絡ください。</p>
  <p><a href="index.html">&larr; トップページに戻る</a></p>
</div>

<script>
  (function () {
    var cfg = window.TOGA_CONFIG || {};
    var link = document.getElementById('order-form-link');
    if (link) link.href = cfg.ORDER_FORM_URL || '#';

    // 計測の重複防止:Stripeから渡される決済ID(session_id)がある時だけ、1決済につき1回だけ計測する
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('session_id') || '';
    var isValidSession = /^cs_(live|test)_[A-Za-z0-9]+$/.test(sessionId);
    var storageKey = 'toga_tracked_' + sessionId;
    var alreadyTracked = false;
    try { alreadyTracked = window.localStorage.getItem(storageKey) === '1'; } catch (e) {}

    var value = (cfg.PRICE && cfg.PRICE.RECT_TAX_INCLUDED) || 143000;
    var isConfigured = function (v) { return !!v && v.indexOf('XXXX') === -1; };

    if (window.gtag && isValidSession && !alreadyTracked) {
      if (isConfigured(cfg.GOOGLE_ADS_CONVERSION_ID) && isConfigured(cfg.CONVERSION_LABEL_RECT)) {
        window.gtag('event', 'conversion', {
          send_to: cfg.GOOGLE_ADS_CONVERSION_ID + '/' + cfg.CONVERSION_LABEL_RECT,
          value: value,
          currency: 'JPY',
          transaction_id: sessionId
        });
      }
      window.gtag('event', 'purchase', {
        transaction_id: sessionId,
        currency: 'JPY',
        value: value,
        items: [{ item_name: '陶雅_長方形' }]
      });
      try { window.localStorage.setItem(storageKey, '1'); } catch (e) {}
    }

    // 決済IDをアドレスバーから消す(再読み込み・URL共有での再計測を防ぐ)
    if (sessionId && window.history && window.history.replaceState) {
      params.delete('session_id');
      var query = params.toString();
      window.history.replaceState(null, '', window.location.pathname + (query ? '?' + query : '') + window.location.hash);
    }
  })();
</script>
</body>
</html>
